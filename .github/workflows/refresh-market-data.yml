name: Refresh Market AI Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: market-ai-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify database
        run: |
          test -f data/market_ai.db
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("data/market_ai.db")
          result = connection.execute("PRAGMA integrity_check").fetchone()[0]
          connection.close()

          if result != "ok":
              raise SystemExit(f"SQLite integrity check failed: {result}")

          print("SQLite integrity check: ok")
          PY

      - name: Collect market data
        run: |
          python collect_data.py \
            --symbols "GC=F" "EURUSD=X" \
            --period 6mo \
            --interval 1h \
            --database-url "sqlite:///./data/market_ai.db"

      - name: Run Engine 1
        run: |
          python run_market_engine.py \
            --symbols "GC=F" "EURUSD=X" \
            --interval 1h

      - name: Run Engine 2
        run: |
          python run_news_engine.py \
            --symbols "GC=F" "EURUSD=X" \
            --lookback-hours 168 \
            --no-gdelt

      - name: Run Engine 3
        run: |
          python run_decision_engine.py \
            --symbols "GC=F" "EURUSD=X" \
            --interval 1h

      - name: Run Risk Engine
        run: |
          python run_risk_engine.py \
            --symbols "GC=F" "EURUSD=X" \
            --interval 1h \
            --account-balance 10000

      - name: Verify results
        run: |
          python inspect_database.py
          python inspect_market_analysis.py
          python inspect_news_analysis.py
          python inspect_decision_analysis.py
          python inspect_risk_evaluations.py

      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_ai.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(data): automatic market refresh"
            git push origin HEAD:main
          fi
